name: tests

# Runs the regression suites on every push and pull request. This is what stops
# a teammate's copy from quietly losing an engine fix: if a rule is broken, the
# pull request goes red before anyone merges it.

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Locate the application file
        id: app
        run: |
          APP=cargo_load_planner_v5.html
          if [ ! -f "$APP" ]; then
            APP=$(ls -1 cargo_load_planner_v*.html 2>/dev/null | sort -V | tail -1)
          fi
          echo "file=$APP" >> "$GITHUB_OUTPUT"
          echo "Testing: $APP"

      - name: Engine invariants
        run: node pack_test.js "${{ steps.app.outputs.file }}"

      - name: Multi-container layer
        run: node multi_pack_test.js "${{ steps.app.outputs.file }}"

      - name: Search stage
        run: node optimizer_test.js "${{ steps.app.outputs.file }}" 2500

      - name: Benchmark (informational — never fails the build)
        continue-on-error: true
        run: node benchmark.js "${{ steps.app.outputs.file }}"

      - name: UI wiring (jsdom)
        continue-on-error: true
        run: |
          npm install jsdom --no-save --silent
          JSDOM_PATH=$(pwd)/node_modules/jsdom node ui_smoke_test.js "${{ steps.app.outputs.file }}"
